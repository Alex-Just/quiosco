name = "quiosco"
main = "worker/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["global_fetch_strictly_public"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# Replace the zero ids with your own (see README). Do not commit personal
# production ids: keep them in gitignored wrangler.local.toml, or let CI
# inject them from repository secrets before deploy.
[[kv_namespaces]]
binding = "BUDGET"
id = "00000000000000000000000000000000"

[vars]
ALLOWED_MODELS = "space-bunny-free,glm-5.3-flash,deepseek-v4.1-flash,gpt-6-luna"
RESPONSES_MODELS = "gpt-6-luna"
DECISION_MODELS = "jev-1.13-free,jev-1.13"
DAILY_CHUNK_BUDGET = "200"

[dev]
port = 8787

[[d1_databases]]
binding = "DB"
database_name = "quiosco"
database_id = "00000000-0000-0000-0000-000000000000"

name = "quiosco"
main = "worker/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["global_fetch_strictly_public"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[kv_namespaces]]
binding = "BUDGET"
id = "1343fc4c1ff24984a5af592619795754"

[vars]
ALLOWED_MODELS = "glm-5.3-flash,deepseek-v4.1-flash,big-pickle,space-bunny-free,longcat-2.5-preview-free,mimo-v2.6-flash-free,nemotron-3.5-lightning-free,gemini-3.5-flash-lite"
DAILY_CHUNK_BUDGET = "200"

[dev]
port = 8787
